name: ci

# Owner-only: runs on pushes to this repo and manual runs.
# No pull_request trigger — fork/outside PRs never start CI.
on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run db:check
      - run: bun run db:check:demo
      # Same compile-time placeholders as Dockerfile builder (not real secrets).
      # /api/auth/[...path] evaluates getNeonAuth() → getServerConfig() at build.
      - name: Build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          DATABASE_DRIVER: neon-http
          NEON_AUTH_BASE_URL: https://build.invalid
          NEON_AUTH_COOKIE_SECRET: build-cookie-secret-at-least-32-chars!!
          OWNER_NEON_AUTH_USER_ID: build-owner
          GOOGLE_CLIENT_ID: build-client-id
          GOOGLE_CLIENT_SECRET: build-only-not-a-secret
          GOOGLE_REDIRECT_URI: http://localhost:3000/api/oauth/google/callback
          TOKEN_ENCRYPTION_KEY_V1: build-only-dummy-token-key-not-secret
        run: bun run build

  # Slice 1: migrations from CI only on push/dispatch (never pull_request).
  migrate:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DEMO_APP_DB_PASSWORD: ${{ secrets.DEMO_APP_DB_PASSWORD }}
        run: |
          if [ -z "${DATABASE_URL_UNPOOLED}" ]; then
            echo "DATABASE_URL_UNPOOLED secret not set; skipping migrate until Terraform outputs are wired."
            exit 0
          fi
          bun run db:migrate
          if [ -n "${DEMO_APP_DB_PASSWORD}" ]; then
            echo "Applying demo migrations (emailtriager_app + RLS + rate limits)…"
            bun run db:migrate:demo
          else
            echo "DEMO_APP_DB_PASSWORD unset; skipping db:migrate:demo (required for public demo unlock)."
          fi
